services:
  - type: web
    name: trustmed-uzm1
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_ENC_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 43200
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: trustmed66@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: trustmed66@gmail.com
      - key: OTP_EXPIRE_MINUTES
        value: 3
      - key: OTP_MAX_ATTEMPTS
        value: 2
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
