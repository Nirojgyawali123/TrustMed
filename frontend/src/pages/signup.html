<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustMed - Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>
    <span>TrustMed</span>
  </div>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="cases.html">Browse Cases</a>
  </div>
</div>
<script type="module" src="../js/topbar.js"></script>
<div class="login-shell">
  <div class="login-card" style="max-width:520px;">
    <h1>Create your account</h1>
    <p class="sub">Sign up as a patient to start a medical fundraiser.</p>
    <div class="field">
      <label>Full name <span class="required">*</span></label>
      <input type="text" id="fullName" placeholder="Enter your full name">
    </div>
    <div class="field-row2">
      <div class="field">
        <label>Date of birth <span class="required">*</span></label>
        <input type="date" id="dob">
      </div>
      <div class="field">
        <label>Phone number <span class="required">*</span></label>
        <input type="tel" id="phone" placeholder="Enter your phone number">
      </div>
    </div>
    <div class="field">
      <label>Address <span class="required">*</span></label>
      <input type="text" id="address" placeholder="Enter your address">
    </div>
    <div class="field">
      <label>Gmail <span class="required">*</span></label>
      <input type="email" id="email" placeholder="Enter your Gmail address">
    </div>
    <div class="field">
      <label>Citizenship number <span class="required">*</span></label>
      <input type="text" id="citizenship" placeholder="Enter your citizenship number">
    </div>
    <hr style="margin:20px 0;border-color:var(--gray-200);">
    <div class="field">
      <label>Choose a username <span class="required">*</span></label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>
    <div class="field">
      <label>Password <span class="required">*</span></label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>
    <div class="field">
      <label>Confirm password <span class="required">*</span></label>
      <input type="password" id="confirmPassword" placeholder="Enter your password again">
    </div>
    <div id="signupStatus" class="hint" style="margin-bottom:12px;text-align:center;"></div>
    <button type="button" class="btn btn-primary btn-block" id="signupBtn">Create account</button>
    <div style="margin-top:16px;text-align:center;font-size:14px;">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>
<script type="module" src="../js/signup.js"></script>
</body>
</html>
