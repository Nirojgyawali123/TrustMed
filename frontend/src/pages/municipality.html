<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustMed - Municipality Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>
    <span>TrustMed<span class="pill amber" style="margin-left:8px;">Municipality</span></span>
  </div>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="cases.html">Browse Cases</a>
  </div>
  <div class="nav-right">
    <a href="login.html" class="btn btn-outline btn-sm">Sign out</a>
  </div>
</div>
<script type="module" src="../js/topbar.js"></script>

  <div class="page">
  <div style="padding:20px 0 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">
    <div>
      <h1 class="page-title">Verify patient identity</h1>
    </div>
    <button type="button" class="btn btn-outline btn-sm" id="reqPwdBtn" style="margin-top:6px;">Request password change</button>
  </div>
  <div id="pwdReqHint" class="hint" style="margin-bottom:12px;display:none;"></div>

  <div class="grid-3" style="margin-bottom:16px;">
    <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">Pending review</div></div>
    <div class="stat-card green"><div class="num" id="statApproved">0</div><div class="label">Approved & live</div></div>
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total cases</div></div>
  </div>

  <div class="grid-2">
    <div>
      <div class="section-head"><h2>Verification queue</h2><span class="count" id="queueCount">0 pending</span></div>
      <div class="queue" id="munQueue"><div class="empty-state">Loading...</div></div>
    </div>
    <div>
      <div class="card">
        <div style="font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px;">CASE DETAIL</div>
        <div id="detailContent"><p class="hint">Select a case from the queue.</p></div>
        <div id="logoSection" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--gray-100);">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Upload your municipality logo</div>
          <input type="file" id="logoInput" accept=".jpg,.jpeg,.png" onchange="handleLogoUpload(event)">
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;" id="actionButtons" hidden>
          <button type="button" class="btn btn-green btn-block" id="approveBtn">Verify &amp; publish case</button>
          <button type="button" class="btn btn-danger" id="rejectBtn">Reject</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="rejectModal">
  <div class="modal" style="text-align:left;max-width:440px;">
    <button type="button" class="close-x" onclick="closeRejectModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3 style="font-size:17px;font-weight:700;margin-bottom:4px;">Reject case</h3>
    <div class="field">
      <label>Reason for rejection (optional)</label>
      <textarea id="rejectReason" placeholder="Enter reason for rejection" style="min-height:80px;"></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button type="button" class="btn btn-outline" onclick="closeRejectModal()">Cancel</button>
      <button type="button" class="btn btn-danger" onclick="confirmReject()">Reject case</button>
    </div>
  </div>
</div>

<script type="module" src="../js/municipality.js"></script>
</body>
</html>
