<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustMed - Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>
    <span>TrustMed</span>
  </div>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="cases.html">Browse Cases</a>
  </div>
</div>
<div class="login-shell">
  <div class="login-card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your account.</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Your username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password">
    </div>
    <div id="loginStatus" class="hint" style="margin-bottom:12px;text-align:center;"></div>
    <button class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
    <div style="margin-top:16px;text-align:center;font-size:14px;">
      New patient? <a href="signup.html">Create an account</a>
    </div>
  </div>
</div>
<script type="module" src="../js/login.js"></script>
</body>
</html>
